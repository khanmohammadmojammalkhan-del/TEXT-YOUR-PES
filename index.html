<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TYP Auction — Bid Calculator</title>
<style>
:root{
  --bg:#05050A; --bg2:#0A0A12; --bg3:#10101C;
  --card:#0C0C16; --card2:#13131F;
  --border:rgba(0,229,255,0.14);
  --gold:#c9a84c; --gold2:#a07830;
  --cyan:#00E5FF;
  --text:#F8FAFC; --text2:#94A3B8; --text3:#64748B;
  --green:#22c55e; --red:#ef4444;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:radial-gradient(circle at top, var(--bg2), var(--bg) 60%);
  color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh; padding-bottom:60px;
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--border);
  background:rgba(10,10,18,0.85); backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px;}
.brand span.gold{color:var(--gold);}
.topbar-right{display:flex; align-items:center; gap:10px;}
.pill{
  font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--border);
  color:var(--text2); background:var(--card2);
}
.pill.admin{border-color:var(--gold); color:var(--gold);}
.btn{
  border:none; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:700;
  cursor:pointer; transition:.15s; color:var(--text);
  background:var(--card2); border:1px solid var(--border);
}
.btn:hover{filter:brightness(1.15);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1a1204; border:none;}
.btn-cyan{background:var(--cyan); color:#012; border:none;}
.btn-green{background:var(--green); color:#04220f; border:none;}
.btn-red{background:var(--red); color:#2a0505; border:none;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}

.wrap{max-width:1200px; margin:0 auto; padding:20px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:20px; margin-bottom:18px;
}
.card h2{font-size:16px; color:var(--gold); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.hidden{display:none !important;}

/* ---------- Setup screen ---------- */
.setup-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.setup-grid{grid-template-columns:1fr;}}
label{font-size:13px; color:var(--text2); display:block; margin-bottom:6px; margin-top:12px;}
input[type=text], input[type=number], input[type=password]{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg3); color:var(--text); font-size:14px;
}
.manager-input-grid{max-height:520px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px;}
.mgr-setup-card{
  background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:10px 12px;
  display:flex; gap:10px; align-items:center;
}
.mgr-setup-card .logo-box{
  width:46px; height:46px; border-radius:10px; border:1.5px dashed var(--border);
  background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:18px;
  overflow:hidden; cursor:pointer; position:relative; flex-shrink:0;
}
.mgr-setup-card .logo-box input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
.mgr-setup-card .fields{flex:1; display:flex; flex-direction:column; gap:5px; min-width:0;}
.mgr-setup-card input[type=text]{padding:6px 10px; font-size:12.5px;}
.mgr-setup-card .fld-label{font-size:9.5px; color:var(--text3); margin:0 0 2px 2px;}
.search-row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.search-row input{flex:1; min-width:160px;}

.pool-progress-wrap{margin:10px 0 14px;}
.pool-progress-label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text2); margin-bottom:6px;}
.pool-progress-label b{color:var(--gold); font-size:14px;}
.pool-progress-track{height:6px; border-radius:6px; background:var(--bg3); overflow:hidden;}
.pool-progress-fill{height:100%; background:linear-gradient(90deg,var(--gold2),var(--gold)); border-radius:6px; transition:width .25s;}
.pool-progress-fill.over{background:linear-gradient(90deg,#7a1f1f,var(--red));}

.player-pick-list{max-height:460px; overflow-y:auto; padding:2px 2px 2px 0;}
.pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:10px;}
.pick-card{
  position:relative; border-radius:12px; overflow:hidden; cursor:pointer;
  background:var(--card2); border:2px solid transparent;
  transition:transform .12s, border-color .12s, box-shadow .12s;
}
.pick-card:hover{transform:translateY(-2px);}
.pick-card.selected{
  border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 8px 20px rgba(201,168,76,0.25);
}
.pick-card .pick-photo{
  width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--bg3);
  display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--text3);
}
.pick-card .pick-info{padding:7px 8px 8px;}
.pick-card .pname{font-size:12px; font-weight:700; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pick-card .pmeta{font-size:10px; color:var(--text3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pick-check{
  position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
  background:rgba(5,5,10,0.55); border:1.5px solid rgba(248,250,252,0.5);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;
  transition:.12s;
}
.pick-card.selected .pick-check{background:var(--gold); border-color:var(--gold); color:#1a1204;}
.pick-card.selected .pick-check::before{content:'✓';}
.pick-empty-msg{grid-column:1/-1; padding:24px; text-align:center; color:var(--text3); font-size:13px;}

/* ---------- Auction screen ---------- */
.auction-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
@media(max-width:960px){.auction-grid{grid-template-columns:1fr;}}
.lot-card{text-align:center; padding:26px 20px;}
.lot-avatar{
  width:120px; height:120px; border-radius:50%; object-fit:cover; margin:0 auto 12px;
  border:3px solid var(--gold); background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:44px;
}
.lot-name{font-size:24px; font-weight:800;}
.lot-meta{color:var(--text2); font-size:13px; margin-top:4px;}
.lot-stats{display:flex; justify-content:center; gap:16px; margin-top:12px; flex-wrap:wrap;}
.lot-stat{font-size:12px; color:var(--text3);}
.lot-stat b{color:var(--text); display:block; font-size:16px;}
.bid-amount{
  font-size:38px; font-weight:900; color:var(--gold); margin:18px 0 4px;
}
.leading-mgr{font-size:14px; color:var(--cyan); font-weight:700;}
.empty-lot{color:var(--text3); padding:50px 10px; font-size:14px;}

.admin-controls{border-top:1px solid var(--border); margin-top:18px; padding-top:16px; text-align:left;}
.bid-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.bid-row select, .bid-row input{flex:1; min-width:120px;}
.action-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.action-row .btn{flex:1;}

.mgr-card{
  background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;
}
.mgr-top{display:flex; justify-content:space-between; align-items:center;}
.mgr-name{font-weight:700; font-size:14px;}
.mgr-budget{font-weight:800; color:var(--green); font-size:14px;}
.mgr-budget.low{color:var(--red);}
.mgr-roster{margin-top:8px; font-size:11.5px; color:var(--text3);}
.mgr-roster .roster-item{display:flex; justify-content:space-between; padding:2px 0;}
.mgr-roster .roster-item span:last-child{color:var(--gold); font-weight:700;}

.tabs{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.tab-btn{
  padding:7px 14px; border-radius:20px; font-size:12.5px; border:1px solid var(--border);
  background:var(--card2); color:var(--text2); cursor:pointer;
}
.tab-btn.active{background:var(--gold); color:#1a1204; border-color:var(--gold); font-weight:700;}
.pool-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.pool-card{
  background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; font-size:12px;
}
.pool-card img, .pool-card .avatar-ph{width:44px; height:44px; margin:0 auto 6px;}
.pool-card .status{font-size:10.5px; margin-top:4px; padding:2px 6px; border-radius:8px; display:inline-block;}
.status.available{background:rgba(0,229,255,.15); color:var(--cyan);}
.status.sold{background:rgba(34,197,94,.15); color:var(--green);}
.status.unsold{background:rgba(239,68,68,.15); color:var(--red);}
.pool-card .sold-info{font-size:10px; color:var(--text3); margin-top:2px;}

.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:999;
  align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:360px; width:100%;}
.modal-box h3{margin-bottom:14px; color:var(--gold);}
.err-msg{color:var(--red); font-size:12.5px; margin-top:8px; display:none;}
.err-msg.show{display:block;}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--card2); border:1px solid var(--gold); color:var(--text); padding:12px 20px;
  border-radius:10px; font-size:13.5px; z-index:1000; display:none; box-shadow:0 8px 24px rgba(0,0,0,.5);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">⚽ TYP <span class="gold">Auction</span> Bid Calculator</div>
  <div class="topbar-right">
    <span class="pill" id="connStatus">🔄 Connecting...</span>
    <span class="pill admin hidden" id="adminPill">🔑 Admin</span>
    <button class="btn btn-sm" id="loginBtn" onclick="openLoginModal()">🔐 Admin Login</button>
    <button class="btn btn-sm hidden" id="logoutBtn" onclick="doLogout()">🚪 Logout</button>
  </div>
</div>

<div class="wrap">

  <!-- ===================== SETUP SCREEN ===================== -->
  <div id="setupScreen" class="hidden">
    <div class="card">
      <h2>🧾 Auction Setup</h2>
      <div class="setup-grid">
        <div>
          <label>💰 প্রতিটা Manager এর Fixed Budget (Coin)</label>
          <input type="number" id="setupBudget" value="4000">

          <label>👔 12 জন Team / Manager এর তথ্য</label>
          <div class="manager-input-grid" id="managerInputs"></div>
        </div>

        <div>
          <label>📋 যাদের নাম বিড এ দেওয়া হয়েছে, এখানে Paste করো (এক লাইনে একটা নাম, বা কমা দিয়ে)</label>
          <textarea id="bulkNamesInput" rows="4" placeholder="যেমন:&#10;Sarowar Ahmed Farhan&#10;Rafiq Islam&#10;..." style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;font-family:inherit;resize:vertical"></textarea>
          <div class="action-row" style="margin-top:8px">
            <button class="btn btn-gold" onclick="bulkSelectByNames()">📥 এই নামগুলো Select করো</button>
          </div>
          <div id="bulkMatchResult" style="font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5"></div>

          <label style="margin-top:16px">🔍 বা নিজে সার্চ করে বেছে নাও (নাম / ক্লাব / district)</label>
          <div class="search-row">
            <input type="text" id="playerSearch" placeholder="সার্চ করো..." oninput="renderPickList()">
            <button class="btn btn-sm" onclick="selectAllVisible()">সব Select</button>
            <button class="btn btn-sm" onclick="clearAllSelection()">Clear</button>
          </div>
          <div class="pool-progress-wrap">
            <div class="pool-progress-label"><span>Selected</span><span><b id="selCount">0</b> / 108</span></div>
            <div class="pool-progress-track"><div class="pool-progress-fill" id="selProgressFill" style="width:0%"></div></div>
          </div>
          <div class="player-pick-list"><div class="pick-grid" id="pickList"></div></div>
        </div>
      </div>

      <div style="margin-top:18px; text-align:center;">
        <button class="btn btn-gold" style="padding:14px 30px; font-size:15px;" onclick="startAuction()">🚀 Auction শুরু করো</button>
      </div>
      <div class="err-msg" id="setupErr"></div>
    </div>
  </div>

  <!-- ===================== AUCTION SCREEN ===================== -->
  <div id="auctionScreen" class="hidden">

    <div class="auction-grid">
      <!-- Current Lot -->
      <div class="card lot-card" id="lotCardWrap">
        <div id="lotEmpty" class="empty-lot">এখনো কোনো player auction এ তোলা হয়নি।</div>

        <div id="lotFilled" class="hidden">
          <div class="lot-avatar" id="lotAvatar">🎮</div>
          <div class="lot-name" id="lotName">-</div>
          <div class="lot-meta" id="lotMeta">-</div>
          <div class="lot-stats" id="lotStats"></div>
          <div class="bid-amount"><span id="lotAmount">0</span> 🪙</div>
          <div class="leading-mgr" id="lotLeader">এখনো কোনো bid হয়নি</div>
        </div>

        <!-- Admin controls -->
        <div class="admin-controls admin-only hidden" id="adminLotControls">
          <label>➕ নতুন Player Auction এ তোলো</label>
          <select id="nextPlayerSelect"></select>
          <div class="action-row">
            <button class="btn btn-cyan btn-sm" onclick="pickNextPlayer()">তোলো Auction এ</button>
          </div>

          <div class="bid-row">
            <select id="bidManagerSelect"></select>
            <input type="number" id="bidAmountInput" placeholder="Bid amount">
            <button class="btn btn-sm btn-cyan" onclick="placeBid()">বিড বসাও</button>
          </div>

          <div class="action-row">
            <button class="btn btn-green" onclick="markSold()">✅ SOLD</button>
            <button class="btn btn-red" onclick="markUnsold()">❌ UNSOLD</button>
          </div>
          <div class="action-row">
            <button class="btn btn-sm" onclick="undoLast()">↩️ Undo Last Sale</button>
            <button class="btn btn-sm btn-cyan" onclick="syncAllTeams()">🏆 সব Manager Team Tournament এ Sync করো</button>
          </div>
          <div class="action-row">
            <button class="btn btn-sm" style="color:var(--red)" onclick="resetAuctionConfirm()">🔄 Reset পুরো Auction</button>
          </div>
        </div>
      </div>

      <!-- Managers -->
      <div class="card">
        <h2>👔 Managers</h2>
        <div id="managersList"></div>
      </div>
    </div>

    <!-- Player Pool -->
    <div class="card">
      <h2>📋 Player Pool</h2>
      <div class="admin-only hidden" style="margin-bottom:12px">
        <button class="btn btn-sm btn-gold" onclick="openAddPlayersModal()">➕ আরও Player যোগ করো (Day 2 ইত্যাদি)</button>
      </div>
      <div class="tabs">
        <div class="tab-btn active" data-f="all" onclick="setPoolFilter('all')">সবাই</div>
        <div class="tab-btn" data-f="available" onclick="setPoolFilter('available')">Available</div>
        <div class="tab-btn" data-f="sold" onclick="setPoolFilter('sold')">Sold</div>
        <div class="tab-btn" data-f="unsold" onclick="setPoolFilter('unsold')">Unsold</div>
      </div>
      <div class="search-row">
        <input type="text" id="poolSearch" placeholder="Pool এ খুঁজো..." oninput="renderPool()">
      </div>
      <div class="pool-grid" id="poolGrid"></div>
    </div>
  </div>

</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <h3>🔐 Admin Login</h3>
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="Admin password">
    <div class="action-row">
      <button class="btn btn-gold" onclick="tryLogin()">Login</button>
      <button class="btn" onclick="closeLoginModal()">Cancel</button>
    </div>
    <div class="err-msg" id="loginErr">❌ ভুল password।</div>
  </div>
</div>

<!-- Add Players Modal (mid-auction, e.g. Day 2) -->
<div class="modal-overlay" id="addPlayersModal">
  <div class="modal-box" style="max-width:540px; max-height:88vh; overflow-y:auto;">
    <h3>➕ Auction Pool এ আরও Player যোগ করো</h3>
    <label>📋 নাম Paste করো (এক লাইনে একটা, বা কমা দিয়ে)</label>
    <textarea id="addBulkNames" rows="3" placeholder="যেমন:&#10;Rafiq Islam&#10;..." style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;font-family:inherit;resize:vertical"></textarea>
    <div class="action-row" style="margin-top:8px">
      <button class="btn btn-sm btn-gold" onclick="addBulkSelectByNames()">📥 Match করো</button>
    </div>
    <div id="addBulkResult" style="font-size:12px;color:var(--text2);margin:6px 0;line-height:1.5"></div>

    <label style="margin-top:12px">🔍 বা সার্চ করে বেছে নাও</label>
    <input type="text" id="addPlayerSearch" placeholder="সার্চ করো..." oninput="renderAddPickList()">
    <div class="counter" id="addSelCounter" style="margin:8px 0; color:var(--cyan); font-weight:700; font-size:13px;">Selected: 0</div>
    <div class="player-pick-list" style="max-height:280px"><div class="pick-grid" id="addPickList"></div></div>

    <div class="action-row" style="margin-top:14px">
      <button class="btn btn-green" onclick="confirmAddPlayers()">✅ Pool এ যোগ করো</button>
      <button class="btn" onclick="closeAddPlayersModal()">বাতিল</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// CONFIG — same Firebase project as TYP Championship main site
// ═══════════════════════════════════════════
const DB = 'https://typ-championship-default-rtdb.firebaseio.com';
const BID_NODE = `${DB}/bidAuction2026`;
const ADMIN_PASSWORD = 'TYP@Admin2026'; // এখানে চাইলে password change করো

let isAdmin = localStorage.getItem('typBidAdmin') === '1';
let allUsers = [];          // full player pool from main TYP db
let selectedUids = new Set(); // setup-screen selection
let state = null;           // live state pulled from /bidAuction2026
let poolFilter = 'all';
let pollTimer = null;
let bidRowFocused = false;

// ---------- helpers ----------
async function dbGet(path){
  const res = await fetch(`${path}.json`);
  return res.ok ? await res.json() : null;
}
async function dbPut(path, data){
  return fetch(`${path}.json`, { method:'PUT', body: JSON.stringify(data) });
}
async function dbPatch(path, data){
  return fetch(`${path}.json`, { method:'PATCH', body: JSON.stringify(data) });
}
async function dbPush(path, data){
  const res = await fetch(`${path}.json`, { method:'POST', body: JSON.stringify(data) });
  return res.json();
}
async function dbDelete(path){
  return fetch(`${path}.json`, { method:'DELETE' });
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.style.display='none', 2600);
}
function scoreOf(p){
  return (p.wins||0)*9 + (p.mvp||0)*5 + (p.draws||0)*3 + (p.goalsFor||0)*1;
}
function avatarHtml(p, size){
  return p.avatarUrl
    ? `<img src="${p.avatarUrl}" style="width:100%;height:100%;object-fit:cover">`
    : `🎮`;
}

// ---------- Admin login ----------
function openLoginModal(){ document.getElementById('loginModal').classList.add('show'); }
function closeLoginModal(){
  document.getElementById('loginModal').classList.remove('show');
  document.getElementById('loginErr').classList.remove('show');
  document.getElementById('loginPass').value = '';
}
function tryLogin(){
  const val = document.getElementById('loginPass').value;
  if (val === ADMIN_PASSWORD){
    isAdmin = true;
    localStorage.setItem('typBidAdmin','1');
    closeLoginModal();
    applyAdminUI();
    showToast('✅ Admin হিসেবে login হয়েছে');
  } else {
    document.getElementById('loginErr').classList.add('show');
  }
}
function doLogout(){
  isAdmin = false;
  localStorage.removeItem('typBidAdmin');
  applyAdminUI();
  showToast('🚪 Logout হয়েছে');
}
function applyAdminUI(){
  document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
  document.getElementById('adminPill').classList.toggle('hidden', !isAdmin);
  document.getElementById('loginBtn').classList.toggle('hidden', isAdmin);
  document.getElementById('logoutBtn').classList.toggle('hidden', !isAdmin);
  render();
}

// ═══════════════════════════════════════════
// SETUP SCREEN
// ═══════════════════════════════════════════
let managerLogos = {}; // i -> base64 dataURL, filled in as logos are uploaded during setup
function buildManagerInputs(){
  const wrap = document.getElementById('managerInputs');
  wrap.innerHTML = '';
  managerLogos = {};
  for (let i=1;i<=12;i++){
    const box = document.createElement('div');
    box.className = 'mgr-setup-card';
    box.innerHTML = `
      <div class="logo-box" id="logoBox${i}">
        🏟️
        <input type="file" accept="image/*" onchange="handleLogoFile(this, ${i})">
      </div>
      <div class="fields">
        <div>
          <div class="fld-label">Team Name</div>
          <input type="text" id="mgrTeamName${i}" value="Team ${i}" placeholder="Team ${i} নাম">
        </div>
        <div>
          <div class="fld-label">Manager Name</div>
          <input type="text" id="mgrName${i}" value="Manager ${i}" placeholder="Manager ${i} নাম">
        </div>
      </div>
    `;
    wrap.appendChild(box);
  }
}
function handleLogoFile(input, i){
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 150;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h*(MAX/w); w = MAX; } }
      else { if (h > MAX) { w = w*(MAX/h); h = MAX; } }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      managerLogos[i] = dataUrl;
      const box = document.getElementById(`logoBox${i}`);
      box.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover"><input type="file" accept="image/*" onchange="handleLogoFile(this, ${i})">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function renderPickList(){
  const q = document.getElementById('playerSearch').value.trim().toLowerCase();
  const list = document.getElementById('pickList');
  const filtered = !q ? allUsers : allUsers.filter(p =>
    (p.name||'').toLowerCase().includes(q) ||
    (p.club||'').toLowerCase().includes(q) ||
    (p.district||'').toLowerCase().includes(q)
  );
  list.innerHTML = filtered.map(p => `
    <div class="pick-card ${selectedUids.has(p.uid)?'selected':''}" id="card_${p.uid}" onclick="togglePick('${p.uid}')">
      <div class="pick-check"></div>
      <div class="pick-photo">${avatarHtml(p)}</div>
      <div class="pick-info">
        <div class="pname">${p.name||'(নাম নেই)'}</div>
        <div class="pmeta">${p.club || p.district || '&nbsp;'}</div>
      </div>
    </div>
  `).join('') || '<div class="pick-empty-msg">কোনো player পাওয়া যায়নি।</div>';
  updateCounter();
}
function togglePick(uid){
  if (selectedUids.has(uid)) selectedUids.delete(uid); else selectedUids.add(uid);
  const card = document.getElementById('card_'+uid);
  if (card) card.classList.toggle('selected', selectedUids.has(uid));
  updateCounter();
}
function updateCounter(){
  const n = selectedUids.size;
  document.getElementById('selCount').textContent = n;
  const pct = Math.min(100, (n/108)*100);
  const fill = document.getElementById('selProgressFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('over', n > 108);
}
function selectAllVisible(){
  const q = document.getElementById('playerSearch').value.trim().toLowerCase();
  const filtered = !q ? allUsers : allUsers.filter(p =>
    (p.name||'').toLowerCase().includes(q) || (p.club||'').toLowerCase().includes(q) || (p.district||'').toLowerCase().includes(q));
  filtered.forEach(p => selectedUids.add(p.uid));
  renderPickList();
}
function clearAllSelection(){ selectedUids.clear(); renderPickList(); }
function matchNamesToPool(names, pool){
  let matched=0, notFound=[], ambiguous=[], hitUids=[];
  names.forEach(n=>{
    const nLower = n.toLowerCase();
    let exact = pool.filter(p=>(p.name||'').toLowerCase().trim()===nLower);
    if (exact.length===1){ hitUids.push(exact[0].uid); matched++; return; }
    if (exact.length>1){ ambiguous.push(n); return; }
    let partial = pool.filter(p=>(p.name||'').toLowerCase().includes(nLower));
    if (partial.length===1){ hitUids.push(partial[0].uid); matched++; return; }
    if (partial.length>1){ ambiguous.push(n); return; }
    notFound.push(n);
  });
  return { matched, notFound, ambiguous, hitUids };
}
function bulkSelectByNames(){
  const raw = document.getElementById('bulkNamesInput').value;
  const names = raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  if (!names.length) return showToast('❌ কমপক্ষে একটা নাম লেখো');
  const { matched, notFound, ambiguous, hitUids } = matchNamesToPool(names, allUsers);
  hitUids.forEach(uid => selectedUids.add(uid));
  renderPickList();
  let msg = `✅ ${matched} জন match হয়ে select হয়েছে।`;
  if (ambiguous.length) msg += `<br>⚠️ একের বেশি মিল পাওয়া গেছে (নিজে সার্চ করে বেছে নাও): ${ambiguous.join(', ')}`;
  if (notFound.length) msg += `<br>❌ পাওয়া যায়নি: ${notFound.join(', ')}`;
  document.getElementById('bulkMatchResult').innerHTML = msg;
  showToast(`✅ ${matched} জন select হয়ে গেছে`);
}

async function loadAllUsersFromMainDB(){
  const data = await dbGet(`${DB}/users`);
  allUsers = data ? Object.entries(data).map(([uid,v])=>({uid, ...v})) : [];
}

async function startAuction(){
  const errEl = document.getElementById('setupErr');
  errEl.classList.remove('show');
  const budget = Number(document.getElementById('setupBudget').value);
  if (!budget || budget <= 0){ errEl.textContent='❌ সঠিক budget দাও।'; errEl.classList.add('show'); return; }
  if (selectedUids.size < 2){ errEl.textContent='❌ কমপক্ষে কিছু player select করো।'; errEl.classList.add('show'); return; }

  const managers = {};
  for (let i=1;i<=12;i++){
    const name = document.getElementById(`mgrName${i}`).value.trim() || `Manager ${i}`;
    const teamName = document.getElementById(`mgrTeamName${i}`).value.trim() || `Team ${i}`;
    const logo = managerLogos[i] || '';
    managers[`m${i}`] = { name, teamName, logo, budget, spent:0 };
  }

  const players = {};
  allUsers.filter(p => selectedUids.has(p.uid)).forEach(p => {
    players[p.uid] = {
      name:p.name||'', avatarUrl:p.avatarUrl||'', club:p.club||'', district:p.district||'',
      wins:p.wins||0, mvp:p.mvp||0, goalsFor:p.goalsFor||0, draws:p.draws||0,
      status:'available'
    };
  });

  await dbPut(BID_NODE, {
    meta: { budget, started:true, startedAt:new Date().toISOString() },
    managers, players,
    currentLot: { uid:null, amount:0, leadingManagerId:null },
    history: {}
  });

  showToast('🚀 Auction শুরু হয়ে গেছে!');
  await pollState();
}

// ═══════════════════════════════════════════
async function pollState(){
  const data = await dbGet(BID_NODE);
  state = data;
  if (!allUsers.length) await loadAllUsersFromMainDB();
  if (!state || !state.meta || !state.meta.started){
    document.getElementById('setupScreen').classList.remove('hidden');
    document.getElementById('auctionScreen').classList.add('hidden');
    buildManagerInputs();
    renderPickList();
  } else {
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('auctionScreen').classList.remove('hidden');
    render();
  }
  document.getElementById('connStatus').textContent = '🟢 Live';
}

function render(){
  if (!state) return;
  renderLot();
  renderManagers();
  renderNextPlayerSelect();
  renderBidManagerSelect();
  renderPool();
  applyAdminOnlyVisibility();
}
function applyAdminOnlyVisibility(){
  document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
}

function renderLot(){
  const lot = state.currentLot || {};
  const players = state.players || {};
  if (!lot.uid || !players[lot.uid]){
    document.getElementById('lotEmpty').classList.remove('hidden');
    document.getElementById('lotFilled').classList.add('hidden');
    return;
  }
  document.getElementById('lotEmpty').classList.add('hidden');
  document.getElementById('lotFilled').classList.remove('hidden');
  const p = players[lot.uid];
  document.getElementById('lotAvatar').innerHTML = avatarHtml(p);
  document.getElementById('lotName').textContent = p.name;
  document.getElementById('lotMeta').textContent = `${p.club||''} ${p.district?('· '+p.district):''}`;
  document.getElementById('lotStats').innerHTML = `
    <div class="lot-stat"><b>${p.wins||0}</b>Wins</div>
    <div class="lot-stat"><b>${p.mvp||0}</b>MVP</div>
    <div class="lot-stat"><b>${p.goalsFor||0}</b>Goals</div>
  `;
  document.getElementById('lotAmount').textContent = lot.amount||0;
  const mgr = lot.leadingManagerId ? (state.managers[lot.leadingManagerId]||{}).name : null;
  document.getElementById('lotLeader').textContent = mgr ? `👑 এগিয়ে আছে: ${mgr}` : 'এখনো কোনো bid হয়নি';
}

function renderManagers(){
  const wrap = document.getElementById('managersList');
  const managers = state.managers || {};
  const players = state.players || {};
  wrap.innerHTML = Object.entries(managers).map(([mid,m])=>{
    const roster = Object.entries(players).filter(([,p])=> p.soldTo === mid);
    const low = m.budget < (state.meta.budget*0.15);
    const synced = !!m.tournamentTeamId;
    const full = roster.length >= SQUAD_SIZE;
    return `
      <div class="mgr-card">
        <div class="mgr-top">
          <span class="mgr-name" style="display:flex;align-items:center;gap:8px">
            ${m.logo?`<img src="${m.logo}" style="width:26px;height:26px;border-radius:6px;object-fit:cover;flex-shrink:0">`:''}
            <span>${m.teamName || m.name} ${synced?'<span title="Auction Tournament এ Team আছে" style="color:var(--cyan);font-size:11px">🏆</span>':''}</span>
          </span>
          <span class="mgr-budget ${low?'low':''}">🪙 ${m.budget}</span>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:1px">👔 ${m.name}</div>
        <div style="font-size:11px;color:${full?'var(--green)':'var(--text3)'};margin-top:2px">${full?'✅ Squad Full':`Squad: ${roster.length}/${SQUAD_SIZE}`}</div>
        <div class="mgr-roster">
          ${roster.length ? roster.map(([uid,p])=>`<div class="roster-item"><span>${p.name}</span><span>${p.price}🪙</span></div>`).join('') : `<div style="opacity:.6">কোনো player কেনা হয়নি</div>`}
        </div>
        <div class="admin-only ${isAdmin?'':'hidden'}" style="margin-top:8px">
          <button class="btn btn-sm" style="width:100%" onclick="syncTeamForManager('${mid}', true)" ${roster.length?'':'disabled'}>
            🔁 Tournament এ ${synced?'Update':'Team তৈরি'} করো
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function renderNextPlayerSelect(){
  const sel = document.getElementById('nextPlayerSelect');
  const players = state.players || {};
  const available = Object.entries(players).filter(([,p]) => p.status !== 'sold');
  const cur = sel.value;
  sel.innerHTML = `<option value="">-- Player বাছাই করো --</option>` +
    available.map(([uid,p]) => `<option value="${uid}">${p.name} ${p.status==='unsold'?'(unsold)':''}</option>`).join('');
  if ([...sel.options].some(o=>o.value===cur)) sel.value = cur;
}
const SQUAD_SIZE = 9; // প্রতিটা manager এর team এ কতজন player থাকবে (manager সহ team size 10)
function rosterCount(mid){
  return Object.values(state.players || {}).filter(p => p.soldTo === mid).length;
}
function renderBidManagerSelect(){
  const sel = document.getElementById('bidManagerSelect');
  const managers = state.managers || {};
  const cur = sel.value;
  sel.innerHTML = `<option value="">-- Manager বাছাই করো --</option>` +
    Object.entries(managers).map(([mid,m]) => {
      const count = rosterCount(mid);
      const full = count >= SQUAD_SIZE;
      return `<option value="${mid}" ${full?'disabled':''}>${m.teamName || m.name} — ${m.name} (🪙${m.budget}) — ${full?'✅ Squad Full (9/9)':`${count}/${SQUAD_SIZE}`}</option>`;
    }).join('');
  if ([...sel.options].some(o=>o.value===cur)) sel.value = cur;
}

function setPoolFilter(f){
  poolFilter = f;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.f===f));
  renderPool();
}
function renderPool(){
  if (!state) return;
  const q = (document.getElementById('poolSearch').value||'').trim().toLowerCase();
  const players = state.players || {};
  const managers = state.managers || {};
  let entries = Object.entries(players);
  if (poolFilter !== 'all') entries = entries.filter(([,p]) => p.status === poolFilter);
  if (q) entries = entries.filter(([,p]) => (p.name||'').toLowerCase().includes(q) || (p.club||'').toLowerCase().includes(q));
  document.getElementById('poolGrid').innerHTML = entries.map(([uid,p])=>{
    const soldMgr = p.soldTo ? (managers[p.soldTo]||{}).name : null;
    return `
      <div class="pool-card">
        <div class="avatar-ph" style="margin:0 auto 6px;overflow:hidden;border-radius:50%">${avatarHtml(p)}</div>
        <div style="font-weight:700">${p.name}</div>
        <div style="color:var(--text3);font-size:10.5px">${p.club||''}</div>
        <div class="status ${p.status}">${p.status}</div>
        ${p.status==='sold' ? `<div class="sold-info">${soldMgr} · 🪙${p.price}</div>` : ''}
      </div>
    `;
  }).join('') || `<div style="padding:20px;color:var(--text3);font-size:13px">কেউ নেই এই তালিকায়।</div>`;
}

// ---------- Admin actions ----------
async function pickNextPlayer(){
  const uid = document.getElementById('nextPlayerSelect').value;
  if (!uid) return showToast('❌ আগে একজন player বাছাই করো');
  await dbPut(`${BID_NODE}/currentLot`, { uid, amount:0, leadingManagerId:null });
  await pollState();
}
async function placeBid(){
  const mid = document.getElementById('bidManagerSelect').value;
  const amount = Number(document.getElementById('bidAmountInput').value);
  const lot = state.currentLot || {};
  if (!lot.uid) return showToast('❌ আগে একজন player আনো auction এ');
  if (!mid) return showToast('❌ Manager বাছাই করো');
  if (!amount || amount <= (lot.amount||0)) return showToast('❌ আগের bid থেকে বেশি amount দাও');
  const mgr = state.managers[mid];
  if (amount > mgr.budget) return showToast(`❌ ${mgr.name} এর কাছে এত coin নেই`);
  if (rosterCount(mid) >= SQUAD_SIZE) return showToast(`❌ ${mgr.name} এর squad ইতিমধ্যে ${SQUAD_SIZE} জন পূর্ণ`);
  await dbPatch(`${BID_NODE}/currentLot`, { amount, leadingManagerId: mid });
  document.getElementById('bidAmountInput').value = '';
  await pollState();
}
async function syncTeamForManager(mid, manual){
  const players = state.players || {};
  const managers = state.managers || {};
  const mgr = managers[mid];
  if (!mgr) return;
  const roster = Object.entries(players).filter(([,p]) => p.soldTo === mid)
    .map(([uid,p], i) => ({ uid, name: p.name || '—', isStarter: i < 7 }));
  if (!roster.length){
    if (manual) showToast('❌ এই Manager এর এখনো কোনো player নেই');
    return;
  }
  // group এখানে default 'A' রাখা হলো — auction শেষে main TYP site এ গিয়ে
  // তোমরা নিজেরা group বাছাই করে fixture generate করবা।
  const payload = {
    name: mgr.teamName || mgr.name, manager: mgr.name, managerPassword: mgr.managerPassword || '',
    emoji: '🏟️', group: mgr.group || 'A', players: roster,
    updatedAt: new Date().toISOString()
  };
  if (mgr.logo) payload.logo = mgr.logo;
  if (mgr.tournamentTeamId){
    await dbPatch(`${DB}/tournament/teams/${mgr.tournamentTeamId}`, payload);
  } else {
    const res = await dbPush(`${DB}/tournament/teams`, payload);
    if (res && res.name) await dbPatch(`${BID_NODE}/managers/${mid}`, { tournamentTeamId: res.name });
  }
  if (manual) showToast(`🏆 ${mgr.name} এর Team Auction Tournament এ sync হলো`);
}
async function syncAllTeams(){
  const managers = state.managers || {};
  for (const mid of Object.keys(managers)) await syncTeamForManager(mid, false);
  showToast('🏆 সব Manager এর Team Auction Tournament এ sync হয়ে গেছে');
  await pollState();
}

// ---------- Add more players mid-auction (Day 2 etc.) ----------
let addSelectedUids = new Set();
function existingPoolUids(){ return new Set(Object.keys((state && state.players) || {})); }
function openAddPlayersModal(){
  addSelectedUids = new Set();
  document.getElementById('addBulkNames').value = '';
  document.getElementById('addBulkResult').innerHTML = '';
  document.getElementById('addPlayerSearch').value = '';
  renderAddPickList();
  document.getElementById('addPlayersModal').classList.add('show');
}
function closeAddPlayersModal(){ document.getElementById('addPlayersModal').classList.remove('show'); }
function renderAddPickList(){
  const existing = existingPoolUids();
  const q = (document.getElementById('addPlayerSearch').value||'').trim().toLowerCase();
  const pool = allUsers.filter(p => !existing.has(p.uid));
  const filtered = !q ? pool : pool.filter(p =>
    (p.name||'').toLowerCase().includes(q) || (p.club||'').toLowerCase().includes(q) || (p.district||'').toLowerCase().includes(q));
  document.getElementById('addPickList').innerHTML = filtered.map(p => `
    <div class="pick-card ${addSelectedUids.has(p.uid)?'selected':''}" id="addcard_${p.uid}" onclick="toggleAddPick('${p.uid}')">
      <div class="pick-check"></div>
      <div class="pick-photo">${avatarHtml(p)}</div>
      <div class="pick-info"><div class="pname">${p.name||'(নাম নেই)'}</div><div class="pmeta">${p.club || p.district || '&nbsp;'}</div></div>
    </div>
  `).join('') || '<div class="pick-empty-msg">সবাই already Pool এ আছে, অথবা কাউকে পাওয়া যায়নি।</div>';
  document.getElementById('addSelCounter').textContent = `Selected: ${addSelectedUids.size}`;
}
function toggleAddPick(uid){
  if (addSelectedUids.has(uid)) addSelectedUids.delete(uid); else addSelectedUids.add(uid);
  const c = document.getElementById('addcard_'+uid);
  if (c) c.classList.toggle('selected', addSelectedUids.has(uid));
  document.getElementById('addSelCounter').textContent = `Selected: ${addSelectedUids.size}`;
}
function addBulkSelectByNames(){
  const existing = existingPoolUids();
  const raw = document.getElementById('addBulkNames').value;
  const names = raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  if (!names.length) return showToast('❌ কমপক্ষে একটা নাম লেখো');
  const pool = allUsers.filter(p => !existing.has(p.uid));
  const { matched, notFound, ambiguous, hitUids } = matchNamesToPool(names, pool);
  hitUids.forEach(uid => addSelectedUids.add(uid));
  renderAddPickList();
  let msg = `✅ ${matched} জন match হয়েছে।`;
  if (ambiguous.length) msg += `<br>⚠️ একের বেশি মিল: ${ambiguous.join(', ')}`;
  if (notFound.length) msg += `<br>❌ পাওয়া যায়নি (অথবা আগেই pool এ আছে): ${notFound.join(', ')}`;
  document.getElementById('addBulkResult').innerHTML = msg;
}
async function confirmAddPlayers(){
  if (!addSelectedUids.size) return showToast('❌ কাউকে select করোনি');
  const updates = {};
  allUsers.filter(p => addSelectedUids.has(p.uid)).forEach(p => {
    updates[p.uid] = {
      name:p.name||'', avatarUrl:p.avatarUrl||'', club:p.club||'', district:p.district||'',
      wins:p.wins||0, mvp:p.mvp||0, goalsFor:p.goalsFor||0, draws:p.draws||0,
      status:'available'
    };
  });
  await dbPatch(`${BID_NODE}/players`, updates);
  showToast(`✅ ${addSelectedUids.size} জন player Pool এ যোগ হয়ে গেছে`);
  closeAddPlayersModal();
  await pollState();
}

async function markSold(){
  const lot = state.currentLot || {};
  if (!lot.uid || !lot.leadingManagerId) return showToast('❌ কোনো leading bid নেই');
  const uid = lot.uid, mid = lot.leadingManagerId, amount = lot.amount;
  const mgr = state.managers[mid];
  const player = state.players[uid];
  if (rosterCount(mid) >= SQUAD_SIZE) return showToast(`❌ ${mgr.name} এর squad ইতিমধ্যে ${SQUAD_SIZE} জন পূর্ণ, আর কেনা যাবে না`);

  await dbPatch(`${BID_NODE}/players/${uid}`, { status:'sold', soldTo:mid, price:amount });
  await dbPatch(`${BID_NODE}/managers/${mid}`, { budget: mgr.budget - amount, spent: (mgr.spent||0) + amount });
  await dbPush(`${BID_NODE}/history`, { uid, playerName:player.name, managerId:mid, managerName:mgr.name, price:amount, time:new Date().toISOString() });
  await dbPut(`${BID_NODE}/currentLot`, { uid:null, amount:0, leadingManagerId:null });

  showToast(`✅ ${player.name} বিক্রি হলো ${mgr.name} এর কাছে ${amount}🪙 তে`);
  await pollState();
  await syncTeamForManager(mid, false);   // auto-sync this manager's squad into Auction Tournament
  await pollState();
}
async function markUnsold(){
  const lot = state.currentLot || {};
  if (!lot.uid) return showToast('❌ কোনো player নেই auction এ');
  await dbPatch(`${BID_NODE}/players/${lot.uid}`, { status:'unsold' });
  await dbPut(`${BID_NODE}/currentLot`, { uid:null, amount:0, leadingManagerId:null });
  showToast('❌ Player unsold হিসেবে মার্ক হলো');
  await pollState();
}
async function undoLast(){
  const history = state.history || {};
  const keys = Object.keys(history);
  if (!keys.length) return showToast('❌ Undo করার মতো কিছু নেই');
  const lastKey = keys[keys.length - 1];
  const entry = history[lastKey];
  const mgr = state.managers[entry.managerId];

  await dbPatch(`${BID_NODE}/players/${entry.uid}`, { status:'available', soldTo:null, price:null });
  await dbPatch(`${BID_NODE}/managers/${entry.managerId}`, { budget: mgr.budget + entry.price, spent: (mgr.spent||0) - entry.price });
  await dbDelete(`${BID_NODE}/history/${lastKey}`);

  showToast(`↩️ Undo হলো: ${entry.playerName}`);
  await pollState();
  await syncTeamForManager(entry.managerId, false);  // keep Auction Tournament roster in sync after undo
  await pollState();
}
async function resetAuctionConfirm(){
  if (!confirm('পুরো auction reset করবে? সব data মুছে যাবে — আবার নতুন করে setup করতে হবে।')) return;
  await dbDelete(BID_NODE);
  showToast('🔄 Auction reset হয়ে গেছে');
  await pollState();
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init(){
  applyAdminUI();
  await pollState();
  pollTimer = setInterval(pollState, 2500);
}
init();
</script>
