<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Half-time | TYP Championship</title>
<style>
:root{--pitch:#0f2a1d;--pitch2:#133224;--line:#3a6b52;--chalk:#f2efe4;--dim:#a9bfae;--light:#f4d35e;--board:#07130d;--card:#101c15;--w:clamp(40px,11.4vw,74px)}
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 16px;overflow-x:hidden;
  background:repeating-linear-gradient(90deg,var(--pitch) 0 80px,var(--pitch2) 80px 160px);
  color:var(--chalk);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
body::before{content:"";position:fixed;left:50%;top:50%;width:min(130vw,760px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(58,107,82,.55);pointer-events:none}
body::after{content:"";position:fixed;left:50%;top:0;bottom:0;width:3px;background:rgba(58,107,82,.55);transform:translateX(-50%);pointer-events:none}
main{width:100%;max-width:560px;text-align:center;position:relative;z-index:1}

/* scoreboard */
.board{background:var(--board);border:2px solid var(--light);border-radius:18px;padding:0 0 20px;box-shadow:0 0 0 6px rgba(244,211,94,.12),0 24px 60px rgba(0,0,0,.55),0 0 60px rgba(244,211,94,.12)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(244,211,94,.35);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--light)}
.live{display:flex;align-items:center;gap:8px;color:var(--chalk)}
.live i{width:9px;height:9px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 10px #ff4d4d}
.clock{display:flex;justify-content:center;align-items:flex-start;gap:clamp(6px,2vw,14px);padding:26px 8px 0}
.grp{text-align:center}
.pair{display:flex;gap:4px}
.grp small{display:block;margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dots{display:flex;flex-direction:column;gap:calc(var(--w)*.28);padding-top:calc(var(--w)*.5)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--light);opacity:.85}

/* flip digit */
.d{position:relative;width:var(--w);height:calc(var(--w)*1.4);perspective:400px;font:700 calc(var(--w)*1.05)/calc(var(--w)*1.4) ui-monospace,"SF Mono","Courier New",monospace;color:var(--light)}
.d span{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);text-align:center;backface-visibility:hidden}
.d span::after{content:attr(data-n);position:absolute;left:0;right:0}
.t,.ft{top:0;border-radius:8px 8px 0 0;border-bottom:1px solid #000}
.t::after,.ft::after{top:0}
.b,.fb{bottom:0;border-radius:0 0 8px 8px;background:#0c1711}
.b::after,.fb::after{bottom:0}
.d::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000;z-index:5;transform:translateY(-1px)}
.t,.b{z-index:1}
.ft{transform-origin:bottom;z-index:3}
.fb{transform-origin:top;z-index:2;transform:rotateX(90deg)}
.flip .ft{animation:ft .3s ease-in forwards}
.flip .fb{animation:fb .3s .3s ease-out forwards}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{to{transform:rotateX(0)}}

h1{margin-top:34px;font-size:clamp(28px,7.5vw,40px);font-weight:800;line-height:1.15;letter-spacing:-.01em}
p{margin:14px auto 0;max-width:40ch;color:var(--dim);font-size:17px;line-height:1.6}
.when{margin-top:22px;display:inline-block;padding:11px 20px;border:1px solid var(--line);border-radius:999px;background:var(--pitch);font-size:15px}
.when strong{color:var(--light)}
button{display:none;margin-top:24px;padding:13px 30px;border:0;border-radius:999px;background:var(--light);color:var(--pitch);font:700 16px "Segoe UI",system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.done button{display:inline-block}
.done .clock,.done .live i{animation:none}
.full{padding:34px 10px 10px;font-size:clamp(36px,11vw,60px);font-weight:800;color:var(--light);letter-spacing:.02em}
.brand{margin-top:36px;font-size:13px;color:var(--dim)}
@media (prefers-reduced-motion:no-preference){.live i{animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.25}}}
@media (prefers-reduced-motion:reduce){.flip .ft,.flip .fb{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<main id="app">
  <div class="board" role="timer" aria-label="Time until the site is back">
    <div class="bar"><span>HALF-TIME</span><span class="live"><i></i>MAINTENANCE</span></div>
    <div class="clock" id="clock">
      <div class="grp"><div class="pair" data-u="h"></div><small>Hours</small></div>
      <div class="dots"><i></i><i></i></div>
      <div class="grp"><div class="pair" data-u="m"></div><small>Minutes</small></div>
      <div class="dots"><i></i><i></i></div>
      <div class="grp"><div class="pair" data-u="s"></div><small>Seconds</small></div>
    </div>
  </div>
  <h1 id="h">It's half-time. We're under maintenance.</h1>
  <p id="m">We're making the site better. It will be unavailable until the timer runs out.</p>
  <div class="when" id="w">Back tomorrow at <strong>2:00 PM</strong> BDT</div>
  <div><button id="b" onclick="location.reload()">Open the site</button></div>
  <div class="brand">TYP · Text Your PES</div>
</main>
<script>
// ===== Change the resume time here (Bangladesh time, UTC+06:00) =====
var RESUME = "2026-10-14T14:00:00+06:00";
// ====================================================================
var end = new Date(RESUME).getTime(), $ = function(i){return document.getElementById(i)};
var digits = {};
function mk(unit){
  var box = document.querySelector('[data-u="'+unit+'"]'); digits[unit] = [];
  for (var i=0;i<2;i++){
    var d = document.createElement("div"); d.className = "d"; d.dataset.v = "";
    d.innerHTML = '<span class="b"></span><span class="t"></span><span class="fb"></span><span class="ft"></span>';
    box.appendChild(d); digits[unit].push(d);
  }
}
function face(d, cls, v){ var e = d.querySelector("."+cls); e.dataset.n = v; }
function setDigit(d, v){
  var old = d.dataset.v;
  if (old === v) return;
  if (old === ""){ ["t","b","ft","fb"].forEach(function(c){face(d,c,v)}); d.dataset.v = v; return; }
  face(d,"t",v); face(d,"ft",old); face(d,"fb",v); face(d,"b",old);
  d.classList.remove("flip"); void d.offsetWidth; d.classList.add("flip");
  d.dataset.v = v;
  setTimeout(function(){ if (d.dataset.v === v){ face(d,"b",v); face(d,"ft",v); d.classList.remove("flip"); } }, 650);
}
function setUnit(u, n){ var s = String(n).padStart(2,"0"); setDigit(digits[u][0], s[0]); setDigit(digits[u][1], s[1]); }
["h","m","s"].forEach(mk);
function tick(){
  var s = Math.floor((end - Date.now())/1000);
  if (s <= 0){
    $("app").classList.add("done");
    $("clock").innerHTML = '<div class="full">FULL-TIME!</div>';
    $("h").textContent = "Maintenance is over";
    $("m").textContent = "The site is live again. Tap the button to jump back in.";
    $("w").style.display = "none";
    return;
  }
  setUnit("h", Math.min(99, Math.floor(s/3600)));
  setUnit("m", Math.floor(s%3600/60));
  setUnit("s", s%60);
  setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
}
tick();
</script>
</body>
</html>
